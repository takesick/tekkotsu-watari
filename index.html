<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鉄骨渡り</title>
<meta name="description" content="スマホを傾けて高層ビルの間の鉄骨を渡る理不尽ゲーム">
<meta property="og:title" content="鉄骨渡り">
<meta property="og:description" content="スマホを傾けて鉄骨を渡れ。突風、ざわ…ざわ…、雷、そして止まれば電流。あなたは何m進める？">
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; color: #f2f2f2;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
    background: rgba(5, 6, 10, .88); }
  .hidden { display: none !important; }
  h1 { font-size: 56px; margin: 0; letter-spacing: .1em; text-shadow: 0 0 18px #c00; }
  h2 { font-size: 34px; margin: 0; }
  p { margin: 0; line-height: 1.7; font-size: 16px; color: #ccc; }
  .big { font-size: 64px; font-weight: bold; color: #fff; }
  button { font: inherit; font-size: 20px; font-weight: bold; padding: 14px 32px; border-radius: 6px;
    border: 2px solid #fff; background: #b00; color: #fff; cursor: pointer; min-width: 220px; }
  button.sub { background: transparent; }
  button.x { background: #000; }
  .small { font-size: 13px; color: #888; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="screen">
  <h1>鉄骨渡り</h1>
  <p>地上74m。幅わずか30cmの鉄骨を渡れ。<br>
    <b>スマホを左右に傾けて</b>バランスを取り、<br>
    <b>画面を押している間</b>だけ前へ進む。</p>
  <p>歩くほど<b>心拍数</b>が上がり、体がふらつく。<br>
    だが<b>3秒止まると鉄骨に電流</b>が流れる。</p>
  <p class="small">PCの場合は ←→ / A D で傾き、スペースかクリック長押しで前進</p>
  <button id="startBtn">渡る</button>
</div>

<div id="result" class="screen hidden">
  <h2 id="causeText">転落…</h2>
  <div class="big"><span id="distText">0</span>m</div>
  <p id="commentText"></p>
  <button id="shareBtn" class="x">𝕏 でシェア</button>
  <button id="retryBtn" class="sub">もう一度渡る</button>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 調整用パラメータ ----------
  const TUNE = {
    heartWalk: 0.045,   // 歩いている間の心拍上昇（/秒）
    heartLean: 0.10,    // 傾きが大きいときの追加上昇（/秒、限界傾きで最大）
    heartRest: 0.16,    // 止まっている間の心拍低下（/秒）
    sensBase: 0.6,      // 重心感度 = sensBase + 心拍数（心拍0.4で従来の難しさ）
    shockWarn: 1.2,     // 止まってから警告が出るまで（秒）
    shockKill: 3.0,     // 止まってから感電するまで（秒）
    firstEvent: 15,     // 最初のイベント地点（m）
    eventGap: [20, 32], // イベントの間隔（m）
    scareHold: 5,       // 雷・悲鳴で心拍が張り付く時間（秒）
  };

  // ---------- 入力 ----------
  const input = { tilt: 0, key: 0, walking: false, hasSensor: false };
  function onOrientation(e) {
    if (e.gamma == null) return;
    input.hasSensor = true;
    const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let deg = e.gamma;
    if (angle === 90) deg = e.beta;
    else if (angle === -90 || angle === 270) deg = -e.beta;
    input.tilt = Math.max(-1, Math.min(1, deg / 30));
  }
  async function enableSensor() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (_) { /* センサーなしでもキーボードで遊べる */ }
    // 許可APIの結果に関係なく登録する（値が来なければキーボード操作のまま）
    window.addEventListener('deviceorientation', onOrientation);
  }
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { input.walking = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space') input.walking = false;
  });
  cv.addEventListener('pointerdown', () => { input.walking = true; });
  window.addEventListener('pointerup', () => { input.walking = false; });
  window.addEventListener('pointercancel', () => { input.walking = false; });

  // ---------- 音 ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    return ac;
  }
  function noise(sec, freq, vol) {
    const a = audio(); if (!a) return;
    const buf = a.createBuffer(1, a.sampleRate * sec, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination); src.start();
  }
  function tone(sec, f0, f1, vol, type) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(); o.type = type || 'sawtooth';
    const g = a.createGain(); g.gain.value = vol;
    o.frequency.setValueAtTime(f0, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + sec);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + sec);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + sec);
  }
  function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

  // ---------- 理不尽イベント ----------
  // 各イベントは start(s) で初期化し、update(s, dt, t) で毎フレーム力などを加える
  const EVENTS = [
    {
      id: 'wind', name: '突風', dur: 3.2,
      start(s) { s.ev.dir = Math.random() < .5 ? -1 : 1; noise(3, 600, .5); vibrate(200); },
      update(s, dt, t) {
        // 最初の0.6秒は予兆、その後強く吹く
        const k = t < .6 ? t / .6 * .3 : 1;
        s.force += s.ev.dir * 2.7 * k * (0.8 + 0.4 * Math.sin(t * 9));
      },
    },
    {
      id: 'zawa', name: 'ざわ…ざわ…', dur: 6,
      start(s) {
        s.ev.marks = [];
        for (let i = 0; i < 26; i++) s.ev.marks.push({
          x: Math.random(), y: Math.random() * .9, r: (Math.random() - .5) * .6,
          size: 24 + Math.random() * 40, ph: Math.random() * 6,
        });
        tone(1.2, 90, 60, .15, 'square');
      },
      update() {},
    },
    {
      // 悲鳴か雷のどちらかで、心拍数が一定時間 0.9〜1 に張り付く
      id: 'scream', name: '悲鳴', dur: TUNE.scareHold,
      start(s) {
        s.ev.lightning = Math.random() < .5;
        s.ev.hold = 0.9 + Math.random() * 0.1;
        if (s.ev.lightning) {
          noise(1.6, 3000, .9); vibrate([80, 40, 300]);
          s.omega += (Math.random() < .5 ? -1 : 1) * 1.1;
        } else { tone(1.4, 1300, 500, .2); vibrate(400); }
      },
      update(s, dt, t) {
        s.heart = Math.min(1, s.ev.hold + Math.sin(t * 7) * .03);
      },
    },
  ];

  // ---------- 状態 ----------
  let s = null;
  let state = 'title';
  function reset() {
    s = {
      theta: 0, omega: 0, dist: 0, t: 0, noise: 0, force: 0, heart: 0,
      still: 0, walked: false, heartPhase: 0,
      nextEvent: TUNE.firstEvent, event: null, ev: {}, evT: 0, banner: null, bannerT: 0,
      walkPhase: 0, fallT: 0, cause: '', comment: '', flash: 0, lastEvent: null,
    };
  }
  reset();

  function startEvent() {
    const pool = EVENTS.filter(e => e !== s.lastEvent);
    const e = pool[Math.floor(Math.random() * pool.length)];
    s.event = e; s.lastEvent = e; s.ev = {}; s.evT = 0;
    e.start(s);
    let label = e.name;
    if (e.id === 'scream') label = s.ev.lightning ? '雷' : '前の挑戦者の悲鳴';
    if (e.id === 'scream' && s.ev.lightning) s.flash = 1;
    s.banner = label; s.bannerT = 2.2;
  }

  function die(cause, comment) {
    if (state !== 'play') return;
    state = 'falling'; s.cause = cause; s.comment = comment; s.fallT = 0;
    tone(1.6, 900, 80, .25); vibrate(600);
  }

  // ---------- 更新 ----------
  function update(dt) {
    if (state === 'play') {
      s.t += dt;
      // 操作量：センサーかキーボード
      const kTarget = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
      input.key += (kTarget - input.key) * Math.min(1, dt * 6);
      const u = input.hasSensor ? input.tilt : input.key;

      // 心拍数：歩くと上がり、止まると下がる。大きく傾いていると焦って上がる
      const lean = Math.min(1, Math.abs(s.theta) / .62);
      s.heart += ((input.walking ? TUNE.heartWalk : -TUNE.heartRest) + TUNE.heartLean * lean * lean) * dt;
      s.heart = Math.max(0, Math.min(1, s.heart));

      // 電流：歩き出した後は、止まり続けると感電する
      if (input.walking) { s.walked = true; s.still = 0; }
      else if (s.walked) s.still += dt;
      if (s.still > TUNE.shockKill) { die('感電', '鉄骨の上で立ち止まり感電した'); return; }

      s.force = 0;
      if (s.event) {
        s.evT += dt;
        s.event.update(s, dt, s.evT);
        if (s.evT >= s.event.dur) s.event = null;
      }
      s.heartPhase += dt * (60 + s.heart * 120) / 60 * Math.PI * 2;

      // 重心感度：心拍数で増え、距離でも少しずつ難しくなる
      const sens = (TUNE.sensBase + s.heart) * (1 + s.dist / 300);

      // ふらつき（歩いていると大きい）
      const amp = (input.walking ? 2.4 : 1.0) * sens;
      s.noise += ((Math.random() - .5) * amp * 6 - s.noise * 1.5) * dt;

      const acc = 3.0 * sens * Math.sin(s.theta) + s.noise + s.force + 4.0 * u - 1.4 * s.omega;
      s.omega += acc * dt;
      s.theta += s.omega * dt;

      if (input.walking) {
        s.dist += 2.2 * dt;
        s.walkPhase += dt * 9;
      }
      if (s.dist >= s.nextEvent && !s.event) {
        startEvent();
        s.nextEvent += TUNE.eventGap[0] + Math.random() * (TUNE.eventGap[1] - TUNE.eventGap[0]);
      }
      if (Math.abs(s.theta) > 0.62) {
        const id = s.event && s.event.id;
        const why = id === 'wind' ? '突風に煽られて落ちた'
          : id === 'zawa' ? 'ざわ…ざわ…で足元を見失った'
          : id === 'scream' ? (s.ev.lightning ? '雷に驚いて足を踏み外した' : '悲鳴につられて落ちた')
          : s.heart > .8 ? '心臓が限界を迎えて落ちた'
          : 'バランスを崩して落ちた';
        die('転落', why);
      }
    } else if (state === 'falling') {
      s.fallT += dt;
      if (s.cause === '感電') { s.omega += Math.sign(s.theta || 1) * 3 * dt; }
      else s.omega += Math.sign(s.theta || 1) * 6 * dt;
      s.theta += s.omega * dt;
      if (s.fallT > 1.4) showResult();
    }
    if (s.bannerT > 0) s.bannerT -= dt;
    if (s.flash > 0) s.flash -= dt * 1.8;
  }

  // ---------- 世界（透視投影） ----------
  // 鉄骨の上面が y=0、地面が y=-74、カメラは鉄骨の上 1.6m。z は前方への距離(m)
  const GROUND = -74, CAM_Y = 1.6, FAR = 320;
  let F = 1, VPY = 0;
  function P(x, y, z) { return [W / 2 + x * F / z, VPY + (CAM_Y - y) * F / z]; }

  // 疑似乱数（建物の形を毎回同じにする）
  function rnd(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // 周りのビル群：z方向に並べ、進むと後ろへ流れていく
  const towers = [];
  for (let i = 0; i < 40; i++) {
    const side = i % 2 ? 1 : -1;
    const near = 28 + rnd(i) * 70;
    towers.push({
      zw: Math.floor(i / 2) * 26 + rnd(i + 50) * 14 - 20,
      x0: side * near, x1: side * (near + 14 + rnd(i + 9) * 22),
      top: -10 + rnd(i + 3) * 60, depth: 14 + rnd(i + 7) * 18, seed: i,
    });
  }
  const LOOP = 20 * 26;

  function fog(z) { return Math.min(.85, z / FAR); }

  function drawTower(t, dist) {
    let z0 = ((t.zw - dist) % LOOP + LOOP) % LOOP - 20;
    let z1 = z0 + t.depth;
    if (z1 < 1) return;
    const zn = Math.max(1, z0);
    const inner = Math.abs(t.x0) < Math.abs(t.x1) ? t.x0 : t.x1;
    const f = fog(zn);
    const base = `rgb(${18 + f * 14},${20 + f * 16},${32 + f * 20})`;
    // 鉄骨側の側面
    const a = P(inner, t.top, zn), b = P(inner, t.top, z1), c = P(inner, GROUND, z1), d = P(inner, GROUND, zn);
    ctx.fillStyle = `rgb(${12 + f * 14},${13 + f * 16},${22 + f * 20})`;
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.lineTo(...d); ctx.fill();
    // 側面の窓
    const rows = Math.floor((t.top - GROUND) / 4), cols = Math.floor(t.depth / 4);
    for (let r = 1; r < rows; r++) for (let k = 0; k < cols; k++) {
      if (rnd(t.seed * 997 + r * 31 + k) > .32) continue;
      const zz = z0 + (k + .5) * 4; if (zz < 1.2) continue;
      const p = P(inner, GROUND + r * 4, zz);
      const sz = Math.max(1, 1.6 * F / zz);
      ctx.fillStyle = rnd(t.seed + r * 7 + k) > .2 ? `rgba(255,214,140,${.75 - f * .5})` : `rgba(160,200,255,${.6 - f * .4})`;
      ctx.fillRect(p[0] - sz / 2, p[1] - sz, sz, sz * 1.3);
    }
    // 正面
    if (z0 >= 1) {
      const p0 = P(t.x0, t.top, z0), p1 = P(t.x1, GROUND, z0);
      ctx.fillStyle = base;
      ctx.fillRect(Math.min(p0[0], p1[0]), p0[1], Math.abs(p1[0] - p0[0]), p1[1] - p0[1]);
      const wc = Math.floor(Math.abs(t.x1 - t.x0) / 4);
      for (let r = 1; r < rows; r++) for (let k = 0; k < wc; k++) {
        if (rnd(t.seed * 131 + r * 17 + k) > .3) continue;
        const x = Math.min(t.x0, t.x1) + (k + .5) * 4;
        const p = P(x, GROUND + r * 4, z0);
        const sz = Math.max(1, 1.6 * F / z0);
        ctx.fillStyle = `rgba(255,214,140,${.75 - f * .5})`;
        ctx.fillRect(p[0] - sz / 2, p[1] - sz, sz, sz * 1.3);
      }
      // 屋上の赤い航空障害灯
      if (Math.sin(s.t * 3 + t.seed) > .3) {
        const q = P((t.x0 + t.x1) / 2, t.top + 1, z0);
        ctx.fillStyle = '#ff2020'; ctx.fillRect(q[0] - 1.5, q[1] - 1.5, 3, 3);
      }
    }
  }

  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 }));
  const cars = Array.from({ length: 24 }, (_, i) => ({ x: [-4, -1.5, 1.5, 4][i % 4], z: Math.random() * FAR, v: (i % 4 < 2 ? 1 : -1) * (8 + Math.random() * 6) }));

  function drawWorld() {
    F = H * .62; VPY = H * .24;
    const dist = s.dist;
    // 空
    let g = ctx.createLinearGradient(0, 0, 0, VPY);
    g.addColorStop(0, '#05060f'); g.addColorStop(1, '#1d2245');
    ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, VPY + H);
    ctx.fillStyle = '#fff';
    for (const st of stars) { ctx.globalAlpha = .5; ctx.fillRect(st.x * W * 1.6 - W * .3, st.y * VPY, st.r, st.r); }
    ctx.globalAlpha = 1;
    // 地上（はるか下）
    g = ctx.createLinearGradient(0, VPY, 0, H);
    g.addColorStop(0, '#1a1c2e'); g.addColorStop(.25, '#0c0d16'); g.addColorStop(1, '#030305');
    ctx.fillStyle = g; ctx.fillRect(-W, VPY, W * 3, H * 2);
    // 道路（鉄骨の真下を走る道と、交差する道）
    ctx.strokeStyle = 'rgba(255,190,90,.22)'; ctx.lineWidth = 1;
    for (const rx of [-6, 6, -40, 40, -90, 90]) {
      const a = P(rx, GROUND, 40), b = P(rx, GROUND, FAR);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    }
    for (let zw = Math.ceil(dist / 50) * 50; zw < dist + FAR; zw += 50) {
      const z = zw - dist; if (z < 40) continue;
      const a = P(-200, GROUND, z), b = P(200, GROUND, z);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    }
    // 街灯
    ctx.fillStyle = 'rgba(255,200,110,.7)';
    for (let zw = Math.ceil(dist / 12) * 12; zw < dist + FAR; zw += 12) {
      const z = zw - dist; if (z < 40) continue;
      for (const rx of [-7, 7]) { const p = P(rx, GROUND, z); ctx.fillRect(p[0], p[1], 1.5, 1.5); }
    }
    // 車のライト
    for (const c of cars) {
      c.z = ((c.z + c.v * (1 / 60) - 40) % (FAR - 40) + (FAR - 40)) % (FAR - 40) + 40;
      const p = P(c.x, GROUND, c.z);
      ctx.fillStyle = c.v > 0 ? '#ff5050' : '#fff6d0';
      ctx.fillRect(p[0] - 1, p[1] - 1, 2.5, 2);
    }

    // 向こう側のゴールのビル
    const gl = P(-28, 60, FAR), gr = P(28, GROUND, FAR);
    ctx.fillStyle = '#20243a'; ctx.fillRect(gl[0], gl[1], gr[0] - gl[0], gr[1] - gl[1]);
    for (let r = 0; r < 30; r++) for (let k = 0; k < 14; k++) {
      if (rnd(r * 14 + k + 500) > .35) continue;
      const p = P(-26 + k * 4, GROUND + 6 + r * 4.4, FAR);
      ctx.fillStyle = 'rgba(255,214,140,.5)'; ctx.fillRect(p[0], p[1], 1.5, 1.5);
    }
    const d0 = P(-1, 2.4, FAR), d1 = P(1, 0, FAR);
    ctx.fillStyle = '#ffe9a8'; ctx.shadowColor = '#ffd36b'; ctx.shadowBlur = 12;
    ctx.fillRect(d0[0], d0[1], d1[0] - d0[0], d1[1] - d0[1]);
    ctx.shadowBlur = 0;

    // ビル群（遠い順）
    const order = towers.map(t => [t, ((t.zw - dist) % LOOP + LOOP) % LOOP - 20]).sort((a, b) => b[1] - a[1]);
    for (const [t] of order) drawTower(t, dist);

    // 鉄骨（I形鋼：下フランジ → 上面）
    const zNear = 1.0;
    const bw = .15;
    ctx.fillStyle = '#24272f';
    let a = P(-bw, -.45, zNear), b = P(bw, -.45, zNear), c = P(bw, -.45, FAR), d = P(-bw, -.45, FAR);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.lineTo(...d); ctx.fill();
    g = ctx.createLinearGradient(0, VPY, 0, H);
    g.addColorStop(0, '#3a3f4b'); g.addColorStop(1, '#6b717f');
    ctx.fillStyle = g;
    a = P(-bw, 0, zNear); b = P(bw, 0, zNear); c = P(bw, 0, FAR); d = P(-bw, 0, FAR);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.lineTo(...d); ctx.fill();
    // リベットの線（進んでいる感）
    ctx.strokeStyle = 'rgba(20,22,28,.8)'; ctx.lineWidth = 1.5;
    for (let zw = Math.ceil((dist + zNear) / 1.5) * 1.5; zw < dist + 60; zw += 1.5) {
      const z = zw - dist;
      const l = P(-bw, 0, z), r = P(bw, 0, z);
      ctx.beginPath(); ctx.moveTo(...l); ctx.lineTo(...r); ctx.stroke();
    }
  }

  function drawPlayer() {
    const fx = W / 2, fy = H * .86;
    const drop = state === 'falling' && s.cause !== '感電' ? s.fallT * s.fallT * H * .6 : 0;
    ctx.save();
    ctx.translate(fx + (drop ? Math.sign(s.theta) * s.fallT * 80 : 0), fy + drop);
    ctx.rotate(s.theta);
    const bob = input.walking && state === 'play' ? Math.sin(s.walkPhase) * 4 : 0;
    ctx.strokeStyle = '#111'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, 0 + bob * .5); ctx.lineTo(-4, -60);
    ctx.moveTo(10, 0 - bob * .5); ctx.lineTo(4, -60); ctx.stroke();
    ctx.fillStyle = '#20232c';
    ctx.fillRect(-20, -125 + bob * .3, 40, 70);
    ctx.strokeStyle = '#20232c'; ctx.lineWidth = 10;
    const armA = Math.sin(s.t * 3) * .1 - s.omega * .2;
    ctx.beginPath();
    ctx.moveTo(-18, -115); ctx.lineTo(-75, -105 + Math.sin(armA) * 40);
    ctx.moveTo(18, -115); ctx.lineTo(75, -105 - Math.sin(armA) * 40); ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(0, -145, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ddd'; ctx.fillRect(-12, -112, 24, 20);
    ctx.fillStyle = '#b00'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('7', 0, -97);
    ctx.restore();
  }

  function sparks(n, alpha) {
    ctx.strokeStyle = `rgba(120,200,255,${alpha})`; ctx.lineWidth = 2;
    for (let k = 0; k < n; k++) {
      ctx.beginPath();
      let x = W / 2 + (Math.random() - .5) * W * .5, y = H;
      ctx.moveTo(x, y);
      for (let j = 0; j < 8; j++) { x += (Math.random() - .5) * 40; y -= H * .07; ctx.lineTo(x, y); }
      ctx.stroke();
    }
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);

    // 画面全体をプレイヤーの傾きに合わせて少し揺らす（心拍が高いと視界も脈打つ）
    const pulse = s.heart > .6 ? Math.max(0, Math.sin(s.heartPhase)) * (s.heart - .6) * .03 : 0;
    ctx.save();
    ctx.translate(W / 2, H * .8); ctx.rotate(-s.theta * .35); ctx.scale(1 + pulse, 1 + pulse);
    ctx.translate(-W / 2, -H * .8);
    drawWorld();
    drawPlayer();
    ctx.restore();

    // 心拍が高いと視界の端が赤くなる
    if (s.heart > .5) {
      const k = (s.heart - .5) * 2 * (.7 + .3 * Math.sin(s.heartPhase));
      const rg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .7);
      rg.addColorStop(0, 'rgba(120,0,0,0)'); rg.addColorStop(1, `rgba(150,0,0,${.55 * k})`);
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    }

    // 電流：止まっている時間に応じて強くなる
    if (state === 'play' && s.still > TUNE.shockWarn * .5) {
      const k = Math.min(1, (s.still - TUNE.shockWarn * .5) / (TUNE.shockKill - TUNE.shockWarn * .5));
      sparks(1 + Math.floor(k * 5), .3 + k * .6);
      ctx.fillStyle = `rgba(80,160,255,${k * .35})`; ctx.fillRect(0, 0, W, H);
      if (s.still > TUNE.shockWarn) {
        ctx.textAlign = 'center'; ctx.fillStyle = '#bfe3ff';
        ctx.font = `bold ${Math.min(30, W * .075)}px serif`;
        ctx.fillText(`⚡ 通電まで ${Math.max(0, TUNE.shockKill - s.still).toFixed(1)} ⚡`, W / 2, H * .45);
      }
    }
    if (state === 'falling' && s.cause === '感電') {
      sparks(8, .9);
      ctx.fillStyle = `rgba(200,230,255,${Math.random() * .5})`; ctx.fillRect(0, 0, W, H);
    }

    // 突風の線
    if (s.event && s.event.id === 'wind') {
      ctx.strokeStyle = 'rgba(220,230,255,.5)'; ctx.lineWidth = 2;
      for (let k = 0; k < 14; k++) {
        const y = (k * 97 + s.evT * 50) % H;
        const x = ((s.evT * 900 * s.ev.dir + k * 233) % (W + 200) + W + 200) % (W + 200) - 100;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s.ev.dir * 90, y); ctx.stroke();
      }
    }

    // ざわ…ざわ…：暗転＋文字
    if (s.event && s.event.id === 'zawa') {
      const t = s.evT, d = s.event.dur;
      const k = Math.min(1, t / .8, (d - t) / .8);
      const rg = ctx.createRadialGradient(W / 2, H * .7, 10, W / 2, H * .7, Math.max(W, H) * .6);
      rg.addColorStop(0, `rgba(0,0,0,${.55 * k})`);
      rg.addColorStop(.5, `rgba(0,0,0,${.88 * k})`);
      rg.addColorStop(1, `rgba(0,0,0,${.97 * k})`);
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      for (const m of s.ev.marks) {
        ctx.save();
        ctx.globalAlpha = k * (.6 + .4 * Math.sin(t * 4 + m.ph));
        ctx.translate(m.x * W + Math.sin(t * 3 + m.ph) * 6, m.y * H);
        ctx.rotate(m.r);
        ctx.font = `bold ${m.size}px serif`;
        ctx.fillStyle = '#e8e8e8';
        ctx.fillText('ざわ…', 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // 悲鳴/雷
    if (s.event && s.event.id === 'scream' && !s.ev.lightning && s.evT < 2.5) {
      ctx.save();
      ctx.translate(W * .5 + (Math.random() - .5) * 10, H * .25);
      ctx.font = `bold ${Math.min(W * .14, 70)}px serif`; ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3030'; ctx.fillText('ぎゃあああ', 0, 0);
      ctx.restore();
    }
    if (s.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, s.flash)})`; ctx.fillRect(0, 0, W, H);
    }

    // HUD
    if (state !== 'title') {
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.font = 'bold 34px serif';
      ctx.fillText(`${s.dist.toFixed(1)}m`, W / 2, 50);
      ctx.font = '12px serif'; ctx.fillStyle = '#aaa';
      ctx.fillText('地上 74m', W / 2, 18);
      // 傾きメーター
      const mw = Math.min(260, W * .7), mx = W / 2 - mw / 2, my = 66;
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(mx, my, mw, 8);
      ctx.fillStyle = 'rgba(255,60,60,.6)';
      ctx.fillRect(mx, my, mw * .12, 8); ctx.fillRect(mx + mw * .88, my, mw * .12, 8);
      const p = Math.max(-1, Math.min(1, s.theta / .62));
      ctx.fillStyle = Math.abs(p) > .75 ? '#ff4040' : '#fff';
      ctx.fillRect(W / 2 + p * mw / 2 - 3, my - 4, 6, 16);
      // 心拍メーター
      const hy = 92, hb = 1 + Math.max(0, Math.sin(s.heartPhase)) * .35;
      ctx.save(); ctx.translate(mx + 8, hy + 4); ctx.scale(hb, hb);
      ctx.fillStyle = '#ff3355'; ctx.font = '18px sans-serif'; ctx.fillText('♥', 0, 6);
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(mx + 22, hy, mw - 22, 8);
      const hc = s.heart < .5 ? '#5fd08a' : s.heart < .8 ? '#ffb340' : '#ff3355';
      ctx.fillStyle = hc; ctx.fillRect(mx + 22, hy, (mw - 22) * s.heart, 8);
      ctx.font = '12px sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = hc;
      ctx.fillText(`${Math.round(60 + s.heart * 120)} bpm`, mx + mw, hy + 22);
      ctx.textAlign = 'center';
      if (state === 'play' && !s.walked) {
        ctx.font = '18px serif'; ctx.fillStyle = '#ddd';
        ctx.fillText('画面を押している間だけ進む', W / 2, H * .5);
      }
    }
    if (s.bannerT > 0 && s.banner) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, s.bannerT * 2);
      ctx.fillStyle = 'rgba(160,0,0,.85)'; ctx.fillRect(0, H * .3 - 34, W, 56);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.font = `bold ${Math.min(32, W * .075)}px serif`;
      ctx.fillText(s.banner, W / 2, H * .3 + 6);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- 画面遷移 ----------
  const $ = id => document.getElementById(id);
  function showResult() {
    state = 'result';
    const d = s.dist.toFixed(1);
    $('causeText').textContent = s.cause + '…';
    $('distText').textContent = d;
    $('commentText').textContent = `${d}m地点で${s.comment}`;
    $('result').classList.remove('hidden');
  }
  function begin() {
    audio(); reset();
    input.walking = false;
    state = 'play';
    $('title').classList.add('hidden'); $('result').classList.add('hidden');
  }
  $('startBtn').addEventListener('click', async () => { await enableSensor(); begin(); });
  $('retryBtn').addEventListener('click', begin);
  $('shareBtn').addEventListener('click', () => {
    const d = s.dist.toFixed(1);
    const text = `鉄骨渡りに挑戦…${d}m地点で${s.comment}\n#鉄骨渡り`;
    const url = location.href.split('#')[0].split('?')[0];
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
  });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
